<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f5;color:#1a1a2e;min-height:100vh}

/* NAV */
.nav{background:#1a1a2e;position:sticky;top:0;z-index:100;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.nav::-webkit-scrollbar{height:3px}.nav::-webkit-scrollbar-thumb{background:#444}
.nav button{color:#8888aa;background:none;border:none;padding:13px 15px;font-size:12px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;letter-spacing:.3px;transition:.2s}
.nav button.active{color:#fff;border-bottom-color:#7c6fff}
.nav button:hover:not(.active){color:#ccc}

/* LAYOUT */
.page{display:none;padding:16px;max-width:960px;margin:0 auto}
.page.active{display:block}

/* CARDS */
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.card-title{font-size:11px;font-weight:700;color:#9999bb;text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px}

/* GRID METRICS */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.metric{background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.metric .lbl{font-size:10px;color:#9999bb;text-transform:uppercase;letter-spacing:.5px}
.metric .val{font-size:18px;font-weight:800;margin-top:3px}
.green{color:#22c55e}.red{color:#ef4444}.purple{color:#7c6fff}.orange{color:#f97316}.blue{color:#3b82f6}

/* PROGRESS */
.prog-item{margin-bottom:16px}
.prog-item:last-child{margin-bottom:0}
.prog-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.prog-name{font-weight:700;font-size:14px}
.prog-nums{font-size:12px;color:#888}
.prog-bar{height:12px;background:#f0f0f5;border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;transition:width .6s ease}
.fill-green{background:linear-gradient(90deg,#22c55e,#16a34a)}
.fill-purple{background:linear-gradient(90deg,#7c6fff,#5b21b6)}
.fill-orange{background:linear-gradient(90deg,#fb923c,#ea580c)}
.fill-blue{background:linear-gradient(90deg,#3b82f6,#1d4ed8)}
.prog-sub{font-size:11px;color:#aaa;margin-top:4px}

/* COUNTDOWN */
.countdown{background:linear-gradient(135deg,#1a1a2e,#2d1b69);color:#fff;border-radius:14px;padding:22px;text-align:center;margin-bottom:14px}
.cd-days{font-size:52px;font-weight:900;color:#a78bfa;line-height:1}
.cd-label{font-size:13px;color:#c4b5fd;margin-top:6px}
.cd-date{font-size:11px;color:#7c6fff;margin-top:2px}

/* TABLES */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:7px 10px;color:#aaa;font-weight:700;font-size:10px;text-transform:uppercase;border-bottom:2px solid #f0f0f5}
td{padding:8px 10px;border-bottom:1px solid #f8f8fc;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafe}
.td-r{text-align:right}
.amt-in{color:#16a34a;font-weight:700}
.amt-out{color:#dc2626;font-weight:600}
.amt-neutral{color:#555;font-weight:600}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;white-space:nowrap}
.b-pago{background:#dcfce7;color:#16a34a}
.b-pendente{background:#fef9c3;color:#a16207}
.b-auto{background:#e0e7ff;color:#4338ca}
.b-nao-pago{background:#fee2e2;color:#dc2626}
.b-aguardando{background:#f3e8ff;color:#7e22ce}
.b-planejado{background:#f0f9ff;color:#0369a1}

/* OVERVIEW TABLE */
.ov-table td:not(:first-child){text-align:right}
.ov-table th:not(:first-child){text-align:right}
.row-real{background:#f8fff8}
.row-plan td{color:#999;font-style:italic}
.row-total{font-weight:700;border-top:2px solid #e8e8f0 !important}

/* ALLOCATION CARD */
.alloc{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.alloc-item{background:#f8f8fc;border-radius:10px;padding:12px;text-align:center}
.alloc-item .a-val{font-size:17px;font-weight:800;color:#1a1a2e}
.alloc-item .a-lbl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.alloc-item .a-pct{font-size:11px;color:#7c6fff;font-weight:600;margin-top:1px}

/* SECTION DIVIDER */
.sec{font-size:11px;font-weight:800;color:#ccc;text-transform:uppercase;letter-spacing:1px;margin:18px 0 8px;padding-left:2px}

/* SOBRA HIGHLIGHT */
.sobra-box{background:#f0fdf4;border:2px solid #86efac;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.sobra-box.negativa{background:#fff1f2;border-color:#fca5a5}
.sobra-label{font-size:12px;color:#555;font-weight:600}
.sobra-val{font-size:22px;font-weight:900}

/* NOTA */
.nota{font-size:11px;color:#aaa;padding:8px 10px;font-style:italic}

/* RESPONSIVO */
@media(max-width:480px){
  .metrics{grid-template-columns:repeat(3,1fr)}
  .metric .val{font-size:14px}
  .alloc{grid-template-columns:repeat(2,1fr)}
}
</style>

function show(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  const el = document.getElementById('page-'+id);
  if(el) el.classList.add('active');
  const btn = document.getElementById('btn-'+id);
  if(btn) btn.classList.add('active');
}

function buildPlanMes(mes, idx){
  const plan = planejado.find(p=>p.mes===mes.label) || planejado[planejado.length-1];

  // Mês numérico a partir do label (ex: "Out/26" → "10")
  const mesMap = {Jan:'01',Fev:'02',Mar:'03',Abr:'04',Mai:'05',Jun:'06',Jul:'07',Ago:'08',Set:'09',Out:'10',Nov:'11',Dez:'12'};
  const mesNum = mesMap[mes.label.split('/')[0]] || '??';
  const fmtDia = dia => dia ? String(dia).padStart(2,'0')+'/'+mesNum : '';

  // Renda
  const rendaExt  = (mes.rendaExtra||[]).reduce((s,r)=>s+r.valor,0);
  const rendaTotal = RENDA_BASE + rendaExt;

  // Fixas
  const fixasExt   = (mes.fixasExtra||[]).reduce((s,f)=>s+f.valor,0);
  const fixasTotal = FIXAS_BASE_TOT + fixasExt;

  // Sobra estimada (variáveis já incluem lazer R$600)
  const sobraEst = rendaTotal - fixasTotal - VAR_EST;

  // Cofrinhos
  let casDeposit = 0, restante = 0, casaDeposit = 0, reservaDeposit = 0;
  let bufferWarn = '';
  if(mes.temCasamento){
    const needed = plan.casamento || 2000;
    if(sobraEst >= needed){
      casDeposit = needed;
      restante = sobraEst - needed;
    } else if(sobraEst > 0){
      casDeposit = sobraEst;
      bufferWarn = `⚠️ Faltam ${fmt(needed - sobraEst)} para o casamento · usa buffer do mês anterior`;
      restante = 0;
    } else {
      bufferWarn = `⚠️ Sobra negativa — usa buffer acumulado para o casamento`;
    }
  } else if(sobraEst > 0){
    restante = sobraEst;
  }
  casaDeposit    = Math.round(restante * 0.70);
  reservaDeposit = Math.round(restante * 0.30);

  // Tag chips
  const tagChip = t => {
    if(!t) return '';
    const styles = {
      '🆕 novo':    'background:#dcfce7;color:#166534',
      '✓ última':   'background:#dbeafe;color:#1d4ed8',
      'único':      'background:#fef9c3;color:#854d0e',
      'penúltima':  'background:#fff7ed;color:#9a3412',
      '🌟 único':   'background:#fef3c7;color:#92400e',
    };
    const st = styles[t] || 'background:#f3f4f6;color:#374151';
    return `<span style="font-size:9px;padding:1px 6px;border-radius:9px;${st};white-space:nowrap;margin-left:4px">${t}</span>`;
  };

  // Receita rows
  const rendaBaseItems = [
    { obs:'Emillyn BLF',                      cat:'Salário',  valor:2500,   dia:15 },
    { obs:'Matheus BLF (líq.)',               cat:'Salário',  valor:2000,   dia:15 },
    { obs:'Komprão',                           cat:'Publi',    valor:1833,   dia:29 },
    { obs:'BC Paula',                          cat:'Mentoria', valor:87.90,  dia:15 },
    { obs:'BC Daiane',                         cat:'Mentoria', valor:87.90,  dia:8  },
    { obs:'BC Ana Karolina',                   cat:'Mentoria', valor:97.90,  dia:11 },
    { obs:'Andressa — Mentoria Estrutura',     cat:'Mentoria', valor:550,    dia:25 },
    { obs:'Panificadora Kelly (líq.)',         cat:'Publi',    valor:500,    dia:29 },
  ];
  const rendaRows = [...rendaBaseItems, ...(mes.rendaExtra||[])].map(r=>`
    <tr>
      <td>${r.obs}${tagChip(r.tag||'')}</td>
      <td style="color:#888;font-size:11px">${r.cat}</td>
      <td style="color:#aaa;font-size:11px;white-space:nowrap">${r.data || fmtDia(r.dia)}</td>
      <td class="td-r amt-in">${fmt(r.valor)}</td>
    </tr>`).join('');

  // Fixas rows (base permanente + extras do mês)
  const allFixas = [
    ...FIXAS_BASE.map(f=>({...f,extra:false})),
    ...(mes.fixasExtra||[]).map(f=>({...f,extra:true}))
  ];
  const fixasRows = allFixas.map(f=>`
    <tr style="${f.extra?'background:#fafafa':''}">
      <td>${f.obs}${tagChip(f.tag||'')}</td>
      <td style="color:#888;font-size:11px">${f.cat}</td>
      <td style="color:#aaa;font-size:11px;white-space:nowrap">${f.data || fmtDia(f.dia)}</td>
      <td class="td-r amt-out">${fmt(f.valor)}</td>
    </tr>`).join('');

  const sobraClass = sobraEst >= 0 ? 'green' : 'red';

  return `
<div class="metrics">
  <div class="metric"><div class="lbl">Receita est.</div><div class="val green">${fmt(rendaTotal)}</div></div>
  <div class="metric"><div class="lbl">Fixas</div><div class="val red">${fmt(fixasTotal)}</div></div>
  <div class="metric"><div class="lbl">Sobra est.</div><div class="val ${sobraClass}">${fmt(sobraEst)}</div></div>
</div>

<div class="card">
  <div class="card-title">Receita esperada · ${fmt(rendaTotal)}</div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Descrição</th><th>Categoria</th><th>Prev.</th><th class="td-r">Valor</th></tr></thead>
    <tbody>${rendaRows}</tbody>
    <tfoot><tr style="font-weight:700;border-top:2px solid #e5e7eb">
      <td colspan="3">Total</td><td class="td-r amt-in">${fmt(rendaTotal)}</td>
    </tr></tfoot>
  </table></div>
  <div class="nota">Variáveis estimadas em ${fmt(VAR_EST)} (inclui lazer ${fmt(LAZER)})</div>
</div>

  <div class="tbl-wrap"><table>
    <thead><tr><th>Descrição</th><th>Categoria</th><th>Venc.</th><th class="td-r">Valor</th></tr></thead>
    <tbody>${fixasRows}</tbody>
    <tfoot><tr style="font-weight:700;border-top:2px solid #e5e7eb">
      <td colspan="3">Total fixas</td><td class="td-r amt-out">${fmt(fixasTotal)}</td>
    </tr></tfoot>
  </table></div>
</div>

<div class="card" style="background:#f8f7ff;border:1px solid #e9d5ff">
  <div class="card-title">Cofrinhos ${mes.label}</div>
  ${bufferWarn?`<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:8px;margin-bottom:10px;font-size:12px;color:#9a3412">${bufferWarn}</div>`:''}
  ${sobraEst<=0 && !mes.temCasamento
    ?`<div style="background:#fef2f2;border-radius:8px;padding:10px;font-size:12px;color:#dc2626">⚠️ Mês de transição — sobra negativa (${fmt(sobraEst)}). Usa buffer acumulado dos meses anteriores.</div>`
    :`<div class="alloc">
    ${mes.temCasamento?`<div class="alloc-item" style="border-left:3px solid #7c6fff">
      <div class="a-val purple">${fmt(casDeposit)}</div>
      <div class="a-lbl">💍 Casamento</div>
      <div class="a-pct">Total: ${fmt(plan.cumCasamento)}</div>
    </div>`:''}
    ${casaDeposit>0?`<div class="alloc-item" style="border-left:3px solid #22c55e">
      <div class="a-val green">${fmt(casaDeposit)}</div>
      <div class="a-lbl">🏠 Casa (70%)</div>
      <div class="a-pct">Total: ${fmt(plan.cumCasa)}</div>
    </div>`:''}
    ${reservaDeposit>0?`<div class="alloc-item" style="border-left:3px solid #3b82f6">
      <div class="a-val blue">${fmt(reservaDeposit)}</div>
      <div class="a-lbl">🛡️ Reserva (30%)</div>
      <div class="a-pct">Total: ${fmt(plan.cumReserva)}</div>
    </div>`:''}
    <div class="alloc-item" style="border-left:3px solid #f97316">
      <div class="a-val orange">R$100</div>
      <div class="a-lbl">🎉 Lazer Casal</div>
      <div class="a-pct">pizzaria parceira</div>
    </div>
    <div class="alloc-item" style="border-left:3px solid #f97316">
      <div class="a-val orange">R$300</div>
      <div class="a-lbl">🎉 Lazer Família</div>
      <div class="a-pct">incl. brinquedos e extras</div>
    </div>
  </div>`}
</div>

<div class="card" style="background:#fffbf0;border:1px solid #fed7aa">
  <div class="card-title">Regra dos Extras</div>
  <div class="nota" style="margin-bottom:10px">Qualquer entrada acima da receita base (MEI extra, projetos, BCs avulsas)</div>

    <div class="alloc-item"><div class="a-val orange">10%</div><div class="a-lbl">Lazer</div></div>

}

function calcPagar(){
  const saldo = parseFloat(document.getElementById('saldo-input').value)||0;
  const res = document.getElementById('pagar-result');
  if(saldo<=0){res.innerHTML='';return;}
  const nao_pago = SET_SF.filter(s=>!getPago(s.id)).sort((a,b)=>a.prio-b.prio||(a.data.localeCompare(b.data)));
  let resto=saldo, pagar=[], semSaldo=[];
  for(const s of nao_pago){
    if(resto>=s.valor){pagar.push(s);resto-=s.valor;}
    else{semSaldo.push(s);}
  }
  const podeCas=Math.min(2000,resto);
  const apos=resto-podeCas;
  const podeCasa=Math.round(apos*0.70);
  const podeRes=Math.round(apos*0.30);
  const mot=MOTIV[Math.floor(Math.random()*MOTIV.length)];
  res.innerHTML=`
    ${pagar.length?`<div style="margin-bottom:10px">${pagar.map(s=>`
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f5f5f5;font-size:13px">
        <span>✅ ${s.obs} <span style="color:#aaa;font-size:10px">(${s.data})</span></span>
        <span style="color:#dc2626;font-weight:600">${fmt(s.valor)}</span>
      </div>`).join('')}</div>`:''}
    ${semSaldo.length?`<div style="background:#fff9f9;border-radius:8px;padding:10px;margin-bottom:10px;font-size:12px;color:#aaa">
      ⚠️ Saldo insuficiente para: ${semSaldo.map(s=>s.obs).join(', ')}
    </div>`:''}
    ${resto>0?`<div style="background:#f0fdf4;border-radius:10px;padding:12px;margin-bottom:10px">
      <div style="font-size:12px;color:#555;font-weight:600;margin-bottom:8px">Com o restante ${fmt(resto)}:</div>
      ${podeCas>0?`<div style="font-size:13px;margin-bottom:5px">💍 Casamento cofrinho: <strong style="color:#7c6fff">${fmt(podeCas)}</strong></div>`:''}
      ${podeCasa>0?`<div style="font-size:13px;margin-bottom:5px">🏠 Casa (70%): <strong style="color:#22c55e">${fmt(podeCasa)}</strong></div>`:''}
      ${podeRes>0?`<div style="font-size:13px">🛡️ Reserva (30%): <strong style="color:#3b82f6">${fmt(podeRes)}</strong></div>`:''}
    </div>`:''}
    <div style="background:linear-gradient(135deg,#1a1a2e,#2d1b69);color:#fff;border-radius:12px;padding:14px;text-align:center;font-size:13px;line-height:1.6;font-style:italic">
      💜 ${mot}
    </div>`;
}

function buildOutubro(){
  const today = new Date();
  const entRec = OUT_ENT.filter(e=>e.status==='recebido').reduce((s,e)=>s+e.valor,0);
  const entTot = OUT_ENT.reduce((s,e)=>s+e.valor,0);
  const sfPago = OUT_SF.filter(e=>getPagoOut(e.id)).reduce((s,e)=>s+e.valor,0);
  const sfPend = OUT_SF.filter(e=>!getPagoOut(e.id)).reduce((s,e)=>s+e.valor,0);
  const saldoReal = OUT_SALDO_INICIAL + entRec - sfPago;

  const sfRows = OUT_SF.map(s=>{
    const pago = getPagoOut(s.id);
    const [d,m] = s.data.split('/').map(Number);
    const due = new Date(2026, m-1, d);
    const overdue = !pago && due < today;
    const statusTxt = pago?'✓ Pago':overdue?'Atrasado':'No prazo';
    const statusCls = pago?'b-pago':overdue?'b-nao-pago':'b-pendente';
    return `<tr style="${pago?'opacity:.45':''}">
      <td>${s.obs}</td><td style="color:#aaa;font-size:11px">${s.cat}</td>
      <td class="td-r ${pago?'':'amt-out'}">${fmt(s.valor)}</td>
      <td style="color:#aaa;font-size:11px">${s.data}</td>
      <td><span class="badge ${statusCls}" style="cursor:pointer;user-select:none" onclick="togglePagoOut('${s.id}')">${statusTxt}</span></td>
    </tr>`;
  }).join('');

  const entRows = OUT_ENT.map(e=>`
    <tr>
      <td>${e.obs}</td><td style="color:#aaa;font-size:11px">${e.cat}</td>
      <td class="td-r amt-in">${fmt(e.valor)}</td>
      <td style="color:#aaa;font-size:11px">${e.data}</td>
      <td><span class="badge ${e.status==='recebido'?'b-pago':'b-planejado'}">${e.status==='recebido'?'✓ Recebido':'A receber'}</span></td>
    </tr>`).join('');

  return `
<div class="metrics">
  <div class="metric"><div class="lbl">Recebido</div><div class="val green">${fmt(entRec)}</div></div>
  <div class="metric"><div class="lbl">A receber</div><div class="val blue">${fmt(entTot-entRec)}</div></div>
  <div class="metric"><div class="lbl">💰 Saldo Total</div><div class="val ${saldoReal>=0?'green':'red'}">${fmt(saldoReal)}</div></div>
</div>

${buildFasesOut()}

<div class="card">
  <div class="card-title">Entradas Outubro · Total ${fmt(entTot)}</div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Item</th><th>Cat.</th><th class="td-r">Valor</th><th>Prev.</th><th>Status</th></tr></thead>
    <tbody>${entRows}</tbody>
  </table></div>
</div>

<div class="card">
  <div class="card-title">Saídas Fixas · <span class="green">${fmt(sfPago)} pago</span> · <span style="color:#aaa">${fmt(sfPend)} pendente</span></div>
  <div class="nota" style="margin-bottom:10px">👆 Toque no status para marcar como pago</div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Descrição</th><th>Cat.</th><th class="td-r">Valor</th><th>Vence</th><th>Status</th></tr></thead>
    <tbody>${sfRows}</tbody>
  </table></div>
</div>`;
}

let hist=[], chatOpen=false;

function toggleChat(){
  chatOpen=!chatOpen;
  document.getElementById('chatPanel').classList.toggle('open',chatOpen);
  if(chatOpen && hist.length===0) initChat();
}

function initChat(){
  if(localStorage.getItem('ant_key')) { showUI(); greet(); }
  else showSetup();
}

function showSetup(){
  document.getElementById('chatMsgs').innerHTML=`
  <div style="padding:16px;text-align:center">
    <div style="font-size:32px;margin-bottom:10px">🔑</div>
    <p style="font-size:13px;color:#555;margin-bottom:12px;line-height:1.5">Para usar o chat, insira sua chave da API Anthropic.<br>Fica salva só no seu celular.</p>
    <input id="akey" type="password" placeholder="sk-ant-..." style="width:100%;border:1.5px solid #e0e0e8;border-radius:10px;padding:10px;font-size:12px;margin-bottom:10px;font-family:monospace;outline:none;box-sizing:border-box">
    <button onclick="saveKey()" style="background:#7c6fff;color:#fff;border:none;border-radius:10px;padding:10px 20px;width:100%;cursor:pointer;font-size:13px;font-weight:700">Salvar e começar</button>
    <div style="font-size:10px;color:#aaa;margin-top:8px">Obtenha em console.anthropic.com → API Keys</div>
  </div>`;
}

function saveKey(){
  const k=document.getElementById('akey').value.trim();
  if(!k.startsWith('sk-ant-')){alert('Chave inválida — deve começar com sk-ant-');return;}
  localStorage.setItem('ant_key',k);
  document.getElementById('chatMsgs').innerHTML='';
  showUI(); greet();
}

function showUI(){ document.getElementById('chatBar').style.display='flex'; }

function greet(){ addMsg('assistant','Oi! 💜 Pode perguntar à vontade — ex: "quero comprar X que custa R$200, é boa ideia?"'); }

function addMsg(role,text){
  const d=document.getElementById('chatMsgs');
  const m=document.createElement('div');
  m.className='msg '+role;
  m.textContent=text;
  d.appendChild(m);
  d.scrollTop=d.scrollHeight;
  return m;
}

async function send(){
  const inp=document.getElementById('cinput');
  const txt=inp.value.trim();
  if(!txt) return;
  const key=localStorage.getItem('ant_key');
  if(!key){showSetup();return;}
  inp.value=''; inp.style.height='auto';
  addMsg('user',txt);
  hist.push({role:'user',content:txt});
  document.getElementById('csend').disabled=true;
  const lm=addMsg('assistant','...');
  lm.style.color='#aaa';
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:300,system:SYS,messages:hist})
    });
    if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'Erro');}
    const j=await r.json();
    const rep=j.content[0].text;
    lm.textContent=rep; lm.style.color='';
    hist.push({role:'assistant',content:rep});
  }catch(e){lm.textContent='❌ '+e.message;lm.style.color='#dc2626';}
  document.getElementById('csend').disabled=false;
}

function hkey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}
function arz(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,80)+'px';}
</script>
